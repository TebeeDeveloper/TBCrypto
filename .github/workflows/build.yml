name: Build Wheels

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Cho phép bạn bấm nút "Run workflow" thủ công trên web

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Build trên cả 3 hệ điều hành
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cibuildwheel setuptools wheel cython

      - name: Build wheels
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          # Cấu hình cibuildwheel tại đây
          # CIBW_SKIP: Bỏ qua các bản Python quá cũ hoặc quá mới không cần thiết
          CIBW_SKIP: "cp36-* cp37-* pp*" 

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl